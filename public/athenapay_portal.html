<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AthenaPay Instant Micro-Credit | Station 3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #030712; color: #f9fafb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: rgba(17, 24, 39, 0.95); border: 1px solid #1f2937; border-radius: 1rem; width: 100%; max-width: 440px; padding: 1.75rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); position: relative; }
    .glow-bar { position: absolute; top: 0; left: 10%; width: 80%; height: 2px; background: linear-gradient(90deg, transparent, #06b6d4, transparent); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 1rem; margin-bottom: 1.25rem; }
    .title { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }
    .badge { font-size: 0.7rem; font-family: monospace; text-transform: uppercase; background: #083344; color: #38bdf8; border: 1px solid #0369a1; padding: 0.2rem 0.5rem; border-radius: 0.25rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem; }
    .label { font-size: 0.75rem; color: #9ca3af; margin-bottom: 0.25rem; display: block; font-weight: 500; }
    .input-readonly { width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.85rem; color: #d1d5db; cursor: not-allowed; }
    .input-amount { color: #34d399; font-weight: 700; }
    .judge-field { margin-top: 1rem; margin-bottom: 1rem; }
    .judge-label { font-size: 0.8rem; font-weight: 600; color: #22d3ee; margin-bottom: 0.35rem; display: flex; justify-content: space-between; }
    .judge-input { width: 100%; background: #111827; border: 2px solid #06b6d4; border-radius: 0.5rem; padding: 0.65rem 0.85rem; font-size: 0.95rem; color: #fff; outline: none; transition: 0.15s; }
    .judge-input:focus { box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.25); border-color: #38bdf8; }
    .btn-apply { width: 100%; padding: 0.85rem; background: linear-gradient(90deg, #06b6d4, #2563eb); border: none; border-radius: 0.75rem; color: #000; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; transition: 0.15s; box-shadow: 0 10px 20px -5px rgba(6, 182, 212, 0.4); }
    .btn-apply:hover { background: linear-gradient(90deg, #22d3ee, #3b82f6); box-shadow: 0 12px 25px -5px rgba(6, 182, 212, 0.6); transform: translateY(-1px); }
    .footer { margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid #1f2937; font-size: 0.7rem; color: #6b7280; display: flex; justify-content: space-between; }
    .success-box { text-align: center; padding: 1.5rem 0; display: none; }
    .checkmark { width: 48px; height: 48px; border-radius: 50%; background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981; color: #10b981; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }

    /* Account Aggregator Sandbox Demo Styles */
    .btn-stepup-link { background: none; border: 1px dashed #f59e0b; color: #fbbf24; font-size: 0.7rem; padding: 0.35rem 0.65rem; border-radius: 0.35rem; cursor: pointer; transition: 0.15s; }
    .btn-stepup-link:hover { background: rgba(245, 158, 11, 0.1); border-color: #fbbf24; }
    .btn-aa-link { background: none; border: 1px dashed #06b6d4; color: #38bdf8; font-size: 0.7rem; padding: 0.35rem 0.65rem; border-radius: 0.35rem; cursor: pointer; transition: 0.15s; }
    .btn-aa-link:hover { background: rgba(6, 182, 212, 0.1); border-color: #38bdf8; }
    .sandbox-tag { display: inline-block; font-size: 0.6rem; font-family: monospace; font-weight: 700; background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); padding: 0.1rem 0.4rem; border-radius: 0.25rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .provider-option { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem; color: #e2e8f0; transition: 0.15s; }
    .provider-option:hover, .provider-option.selected { border-color: #06b6d4; background: rgba(6, 182, 212, 0.1); }
    .consent-box { background: #1e293b; border-radius: 0.5rem; padding: 0.75rem; font-size: 0.75rem; color: #cbd5e1; text-align: left; margin: 0.75rem 0; border: 1px solid #334155; }
    .consent-checkbox-label { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.72rem; color: #94a3b8; cursor: pointer; margin-top: 0.5rem; text-align: left; }
    .aa-step-title { font-size: 0.75rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-bottom: 0.35rem; text-align: left; }
    .demo-data-card { background: #111827; border: 1px solid #1f2937; border-radius: 0.4rem; padding: 0.5rem; font-family: monospace; font-size: 0.7rem; color: #94a3b8; text-align: left; margin-bottom: 0.6rem; }
    .progress-line { font-family: monospace; font-size: 0.75rem; color: #38bdf8; margin: 0.5rem 0; min-height: 18px; }
</head>
<body>

  <div class="card">

        <span class="pulse-dot"></span>

    <!-- Live Form -->
    <form id="loan-form">
      <div class="grid">

      <div class="grid">

        </div>

          <span style="font-weight:400;color:#9ca3af;font-size:0.7rem;">e.g. Laptop repair fee</span>
        </label>
        <input id="input-reason" type="text" class="judge-input" placeholder="Type 3 words here..." required autofocus>
      </div>

      <button id="btn-apply" type="submit" class="btn-apply">
        &gt;&gt; APPLY NOW (INSTANT DISBURSAL) &lt;&lt;
      </button>

      <div style="margin-top: 0.75rem; display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
        <button type="button" onclick="triggerStepUpDemo()" class="btn-stepup-link">
          ⚖️ Safeguard: 1-Rupee UPI Step-Up
        </button>
        <button type="button" onclick="openAAModal()" class="btn-aa-link">
          🏦 Verify via Account Aggregator <span class="sandbox-tag">DEMO</span>
        </button>
      </div>
    </form>

    <!-- Step-Up Challenge Modal (Zero Permanent Bans Safeguard) -->
    <div id="stepup-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center; padding:1rem;">
      <div style="background:#0f172a; border:2px solid #f59e0b; border-radius:1rem; max-width:400px; width:100%; padding:1.5rem; text-align:center; box-shadow:0 0 30px rgba(245,158,11,0.25);">
        <div style="font-size:2rem; margin-bottom:0.5rem;">🛡️</div>
        <h3 style="color:#fbbf24; font-size:1.1rem; font-weight:700; margin-bottom:0.5rem;">Frictionless Step-Up Verification</h3>
        <p style="color:#94a3b8; font-size:0.8rem; line-height:1.4; margin-bottom:1rem;">
          Temporary quarantine challenge triggered pursuant to RBI fraud prevention guidelines. 
          Real humans clear this in under 10 seconds via a <strong>₹1 UPI Penny-Drop</strong> or Account Aggregator consent.
        </p>
        <div style="background:#1e293b; border-radius:0.5rem; padding:0.75rem; font-family:monospace; font-size:0.75rem; color:#cbd5e1; text-align:left; margin-bottom:1rem;">
          <div>Syndicate Blast-Radius: <span style="color:#f87171;">ISOLATED</span></div>
          <div>Fee-Bearing KYC APIs: <span style="color:#34d399;">HALTED (₹61 SAVED)</span></div>
          <div>Step-Up Challenge: <span style="color:#fbbf24;">UPI PENNY-DROP PENDING</span></div>
        </div>
        <button id="btn-verify-upi" onclick="executePennyDrop()" style="width:100%; padding:0.75rem; background:linear-gradient(90deg, #f59e0b, #d97706); border:none; border-radius:0.5rem; color:#000; font-weight:bold; font-size:0.85rem; cursor:pointer; margin-bottom:0.5rem;">
          VERIFY VIA 1-RUPEE UPI PENNY DROP (&lt;10s)
        </button>
        <div style="margin-bottom:0.5rem;">
          <button type="button" onclick="closeStepUpModal(); openAAModal();" style="background:none; border:none; color:#38bdf8; font-size:0.75rem; text-decoration:underline; cursor:pointer;">
            Or verify via Account Aggregator (Setu / OneMoney DEMO)
          </button>
        </div>
        <button onclick="closeStepUpModal()" style="background:none; border:none; color:#64748b; font-size:0.75rem; cursor:pointer;">Cancel</button>
      </div>
    </div>

    <!-- Account Aggregator Sandbox Demo Modal -->
    <div id="aa-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center; padding:1rem;">
      <div style="background:#0f172a; border:2px solid #06b6d4; border-radius:1rem; max-width:440px; width:100%; padding:1.5rem; text-align:center; box-shadow:0 0 30px rgba(6,182,212,0.25); position:relative;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; border-bottom:1px solid #1e293b; padding-bottom:0.5rem;">
          <div style="display:flex; align-items:center; gap:0.4rem;">
            <span style="font-size:1.2rem;">🏦</span>
            <strong style="color:#fff; font-size:0.95rem;">Account Aggregator Verification</strong>
          </div>
          <span class="sandbox-tag">DEMO / SANDBOX</span>
        </div>

        <!-- AA Modal Content Body -->
        <div id="aa-body-content">
          <p style="color:#94a3b8; font-size:0.75rem; line-height:1.4; margin-bottom:0.75rem; text-align:left;">
            Simulate instant financial identity clearance via RBI-regulated Account Aggregator rails. No real credentials or live APIs used.
          </p>

          <!-- Step 1: Provider Selection -->
          <div style="margin-bottom:0.75rem;">
            <div class="aa-step-title">Step 1: Select Account Aggregator (Simulated)</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
              <div id="provider-setu" class="provider-option selected" onclick="selectAAProvider('Setu')">
                <input type="radio" name="aa_provider" id="radio-setu" checked>
                <label for="radio-setu" style="cursor:pointer; font-weight:600;">Setu (Demo)</label>
              </div>
              <div id="provider-onemoney" class="provider-option" onclick="selectAAProvider('OneMoney')">
                <input type="radio" name="aa_provider" id="radio-onemoney">
                <label for="radio-onemoney" style="cursor:pointer; font-weight:600;">OneMoney (Demo)</label>
              </div>
            </div>
          </div>

          <!-- Step 2: Information to Share -->
          <div style="margin-bottom:0.75rem;">
            <div class="aa-step-title">Step 2: Consented Data Scope (Simulated)</div>
            <div class="demo-data-card">
              <div>Institution: <span style="color:#38bdf8;">Athena Demo Bank</span> <span class="sandbox-tag" style="font-size:0.55rem;">DEMO DATA</span></div>
              <div>Account: <span style="color:#cbd5e1;">XXXX XXXX 4821 (Savings)</span></div>
              <div>Period: <span style="color:#cbd5e1;">01 Sep 2026 – 30 Sep 2026</span></div>
              <div style="margin-top:0.35rem; display:flex; gap:0.6rem; color:#e2e8f0; font-size:0.68rem;">
                <label style="display:flex; align-items:center; gap:0.25rem;"><input type="checkbox" checked disabled> Recent Bank Statement</label>
                <label style="display:flex; align-items:center; gap:0.25rem;"><input type="checkbox" checked disabled> Account Verification</label>
              </div>
            </div>
          </div>

          <!-- Step 3: Consent Explanation -->
          <div class="consent-box">
            <div style="font-weight:700; color:#38bdf8; margin-bottom:0.25rem; font-size:0.75rem;">Consent Explanation</div>
            <p style="margin:0; font-size:0.7rem; color:#cbd5e1; line-height:1.3;">
              By continuing, you authorize this <strong>DEMO environment</strong> to simulate retrieval of consented financial information for instant step-up de-quarantine.
            </p>
            <label class="consent-checkbox-label">
              <input type="checkbox" id="aa-consent-checkbox" onchange="onConsentToggled()">
              <span>I give consent to retrieve simulated financial statement data (Required)</span>
            </label>
          </div>

          <div id="aa-validation-msg" style="color:#ef4444; font-size:0.72rem; min-height:16px; margin-bottom:0.5rem; text-align:left;"></div>

          <!-- Action Buttons -->
          <button id="btn-verify-aa" onclick="executeAAVerification()" style="width:100%; padding:0.75rem; background:linear-gradient(90deg, #06b6d4, #2563eb); border:none; border-radius:0.5rem; color:#000; font-weight:bold; font-size:0.85rem; cursor:pointer; margin-bottom:0.5rem; letter-spacing:0.03em;">
            VERIFY VIA ACCOUNT AGGREGATOR (DEMO)
          </button>
          <button onclick="closeAAModal()" style="background:none; border:none; color:#64748b; font-size:0.75rem; cursor:pointer;">Cancel</button>
        </div>

        <!-- Simulated Retrieval Progress / Success Container -->
        <div id="aa-progress-content" style="display:none; padding:1rem 0;">
          <div style="font-size:2rem; margin-bottom:0.5rem;" id="aa-progress-icon">⏳</div>
          <h4 id="aa-progress-title" style="color:#38bdf8; font-size:0.95rem; margin-bottom:0.5rem;">Requesting consent...</h4>
          <div class="progress-line" id="aa-progress-detail">Contacting simulated provider...</div>
          <div id="aa-success-summary" style="display:none; background:#1e293b; border-radius:0.5rem; padding:0.75rem; font-family:monospace; font-size:0.72rem; color:#cbd5e1; text-align:left; margin:0.75rem 0;">
            <div>Provider: <span id="aa-provider-name-display" style="color:#38bdf8;">Setu</span> (Demo)</div>
            <div>Consent: <span style="color:#10b981;">GRANTED</span></div>
            <div>Statement Retrieval: <span style="color:#10b981;">SIMULATED SUCCESS</span></div>
            <div>Verification Status: <span style="color:#34d399; font-weight:bold;">VERIFIED</span></div>
          </div>
          <button id="btn-aa-finish" onclick="completeAAVerification()" style="display:none; width:100%; padding:0.75rem; background:linear-gradient(90deg, #10b981, #059669); border:none; border-radius:0.5rem; color:#000; font-weight:bold; font-size:0.85rem; cursor:pointer; margin-top:0.5rem;">
            CONTINUE TO APPROVED LOAN &gt;&gt;
          </button>
        </div>
      </div>
    </div>

    <!-- Success Feedback -->
    <div id="success-box" class="success-box">
      <div class="checkmark">✓</div>
      <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.35rem;">Loan Approved!</h3>
      <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 1rem;">Disbursing <strong style="color:#34d399;">INR 10,000</strong> to linked bank account.</p>
      <div style="background:#1f2937; border-radius:0.5rem; padding:0.75rem; font-size:0.75rem; text-align:left; font-family:monospace; margin-bottom:1rem; color:#d1d5db;">
        <div>Status: <span style="color:#10b981;font-weight:bold;">HUMAN_VERIFIED</span></div>
        <div>Telemetry: <span style="color:#06b6d4;">Neuromotor tremor captured</span></div>
        <div id="stepup-badge" style="display:none; color:#fbbf24;">Safeguard: Step-Up UPI Verified (100% Cleared)</div>
      </div>
      <button onclick="resetForm()" style="background:none; border:none; color:#9ca3af; text-decoration:underline; font-size:0.75rem; cursor:pointer;">Reset for next judge</button>
    </div>

    <div class="footer">
      <span>Protected by ShadowGram Relational Forensics</span>
      <span>v2.0-HackAthena</span>
    </div>

  <!-- Telemetry SDK -->
  <script src="/telemetry.js"></script>
  <script>
    const form = document.getElementById('loan-form');
    const successBox = document.getElementById('success-box');
    const stepupModal = document.getElementById('stepup-modal');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (window.ShadowGramTelemetry) {
        window.ShadowGramTelemetry.pushEvent('loan_submit', {
          route_path: '/loan -> /loan_approved',
          reason_length: document.getElementById('input-reason').value.length
        });
        window.ShadowGramTelemetry.flush();
      }
      form.style.display = 'none';
      successBox.style.display = 'block';
    });

    function triggerStepUpDemo() {
      stepupModal.style.display = 'flex';
    }

    function closeStepUpModal() {
      stepupModal.style.display = 'none';
    }

    // Common Verification Success Pathway (Shared by UPI Penny Drop & Account Aggregator Demo)
    function onVerificationCleared(methodName) {
      form.style.display = 'none';
      successBox.style.display = 'block';
      const badge = document.getElementById('stepup-badge');
      if (badge) {
        if (methodName === 'Account Aggregator') {
          badge.textContent = 'Safeguard: Account Aggregator Verified (DEMO Sandbox Cleared)';
          badge.style.color = '#38bdf8';
        } else {
          badge.textContent = 'Safeguard: Step-Up UPI Verified (100% Cleared)';
          badge.style.color = '#fbbf24';
        }
        badge.style.display = 'block';
      }
    }

    async function executePennyDrop() {
      const btn = document.getElementById('btn-verify-upi');
      btn.textContent = 'Verifying UPI Micro-Deposit...';
      btn.style.opacity = '0.7';

      const sId = (window.ShadowGramTelemetry && window.ShadowGramTelemetry.sessionId) || 'sess-judge-live';
      const aId = (window.ShadowGramTelemetry && window.ShadowGramTelemetry.accountId) || 'ACC-JUDGE-01';

      try {
        const resp = await fetch('http://localhost:8000/api/step-up/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sId,
            account_id: aId,
            method: 'upi_penny_drop',
            auth_token: 'UPI-REF-992144'
          })
        });
        const data = await resp.json();
        console.log('[Step-Up Response]', data);
      } catch (err) {
        console.warn('[Step-Up Local Mode]', err);
      }

      setTimeout(() => {
        closeStepUpModal();
        onVerificationCleared('UPI Penny Drop');
      }, 600);
    }

    // Account Aggregator Sandbox Demo State & Handlers
    const aaModal = document.getElementById('aa-modal');
    let selectedAAProvider = 'Setu';

    function openAAModal() {
      aaModal.style.display = 'flex';
      // Reset modal state
      document.getElementById('aa-body-content').style.display = 'block';
      document.getElementById('aa-progress-content').style.display = 'none';
      document.getElementById('aa-consent-checkbox').checked = false;
      document.getElementById('aa-validation-msg').textContent = '';
      document.getElementById('btn-verify-aa').disabled = false;
      document.getElementById('btn-verify-aa').style.opacity = '1';
    }

    function closeAAModal() {
      aaModal.style.display = 'none';
    }

    function selectAAProvider(providerName) {
      selectedAAProvider = providerName;
      const setuBox = document.getElementById('provider-setu');
      const onemoneyBox = document.getElementById('provider-onemoney');
      const radioSetu = document.getElementById('radio-setu');
      const radioOnemoney = document.getElementById('radio-onemoney');

      if (providerName === 'Setu') {
        setuBox.classList.add('selected');
        onemoneyBox.classList.remove('selected');
        radioSetu.checked = true;
      } else {
        onemoneyBox.classList.add('selected');
        setuBox.classList.remove('selected');
        radioOnemoney.checked = true;
      }
    }

    function onConsentToggled() {
      const checked = document.getElementById('aa-consent-checkbox').checked;
      if (checked) {
        document.getElementById('aa-validation-msg').textContent = '';
      }
    }

    function executeAAVerification() {
      const consentChecked = document.getElementById('aa-consent-checkbox').checked;
      const validationMsg = document.getElementById('aa-validation-msg');
      if (!consentChecked) {
        validationMsg.textContent = '⚠️ Explicit consent is required to simulate Account Aggregator retrieval.';
        return;
      }

      // Transition to simulated retrieval progress
      document.getElementById('aa-body-content').style.display = 'none';
      const progressContent = document.getElementById('aa-progress-content');
      progressContent.style.display = 'block';

      const icon = document.getElementById('aa-progress-icon');
      const title = document.getElementById('aa-progress-title');
      const detail = document.getElementById('aa-progress-detail');
      const summary = document.getElementById('aa-success-summary');
      const finishBtn = document.getElementById('btn-aa-finish');
      const providerDisplay = document.getElementById('aa-provider-name-display');

      providerDisplay.textContent = selectedAAProvider;
      icon.textContent = '⏳';
      title.textContent = 'Requesting consent token...';
      detail.textContent = `Connecting to ${selectedAAProvider} sandbox rails...`;

      // Visual sequence simulation: No real network request made
      setTimeout(() => {
        title.textContent = 'Consent recorded...';
        detail.textContent = 'Simulating retrieval of consented financial statement...';
      }, 700);

      setTimeout(() => {
        icon.textContent = '✓';
        title.style.color = '#34d399';
        title.textContent = '✓ Account Aggregator Verification Successful (DEMO / SANDBOX)';
        detail.textContent = 'Simulated financial statements validated under RBI AA framework.';
        summary.style.display = 'block';
        finishBtn.style.display = 'block';
      }, 1500);
    }

    function completeAAVerification() {
      closeAAModal();
      // Reuse canonical verification-success pathway
      onVerificationCleared('Account Aggregator');
    }

    function resetForm() {
      document.getElementById('input-reason').value = '';
      document.getElementById('stepup-badge').style.display = 'none';
      successBox.style.display = 'none';
      form.style.display = 'block';
      document.getElementById('input-reason').focus();
    }
  </script>
</body>
